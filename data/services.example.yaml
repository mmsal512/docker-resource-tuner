# ==============================================================================
# Docker Resource Tuner - Example Services Configuration File
# File Name: services.example.yaml
#
# Instructions:
# 1. Copy this file to 'data/services.yaml':
#    cp data/services.example.yaml data/services.yaml
# 2. Update 'compose_file' path to point to your docker-compose.yml file.
# 3. List all your docker compose services and assign appropriate types and weights.
# ==============================================================================

# Absolute path to your target docker-compose.yml file
compose_file: /absolute/path/to/your/docker-compose.yml

# List of services defined in your docker-compose.yml
services:
  # ----------------------------------------------------------------------------
  # Reverse Proxies & Ingress Gateways
  # Allowed Types: proxy, infrastructure
  # Weights: low, medium, high
  # ----------------------------------------------------------------------------
  traefik:
    type: proxy
    weight: medium

  cloudflared:
    type: infrastructure
    weight: low

  # ----------------------------------------------------------------------------
  # Databases (PostgreSQL, MySQL, MariaDB, MongoDB, etc.)
  # Allowed Types: database
  # Weights: medium, high
  # ----------------------------------------------------------------------------
  app-database:
    type: database
    weight: high

  # ----------------------------------------------------------------------------
  # Cache & Key-Value Stores (Redis, Memcached, etc.)
  # Allowed Types: cache
  # Weights: low, medium
  # ----------------------------------------------------------------------------
  app-redis:
    type: cache
    weight: low

  # ----------------------------------------------------------------------------
  # Applications, APIs & Web Services
  # Allowed Types: app, static, sandbox, worker
  # Weights: low, medium, high
  # ----------------------------------------------------------------------------
  web-app:
    type: app
    weight: high

  isolated-env:
    type: sandbox
    weight: medium

  # ----------------------------------------------------------------------------
  # Monitoring, Logging & Management Tools
  # Allowed Types: monitoring, maintenance, management
  # Weights: low, medium
  # ----------------------------------------------------------------------------
  cadvisor:
    type: monitoring
    weight: low

  portainer:
    type: management
    weight: low
