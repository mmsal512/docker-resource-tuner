# ==========================================================
# docker-compose.yml — Example (matches sizing.example.yml)
#
# This file demonstrates how service names in docker-compose
# align with the keys in sizing.yml.
#
# ⚠️ The resource limits (CPU, memory, PIDs) are NOT defined
#    here. They are generated by rt.py into:
#       out/docker-compose.resources.yml
#    and applied as an overlay:
#       docker compose -f docker-compose.yml \
#         -f out/docker-compose.resources.yml up -d
# ==========================================================

services:
  # ============================================================
  # App 1 — Primary Laravel Application (high priority)
  # ============================================================
  app1-web:
    image: app1-image:latest
    container_name: app1-web
    restart: unless-stopped
    depends_on:
      app1-db:
        condition: service_healthy
      app1-redis:
        condition: service_started
    environment:
      APP_NAME: "App1"
      APP_ENV: production
      APP_KEY: base64:REPLACE_WITH_YOUR_REAL_APP_KEY
      APP_DEBUG: "false"
      APP_URL: https://app1.example.com
      DB_CONNECTION: pgsql
      DB_HOST: app1-db
      DB_PORT: "5432"
      DB_DATABASE: app1_db
      DB_USERNAME: app1_user
      DB_PASSWORD: secret_password
      REDIS_HOST: app1-redis
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app1-storage:/var/www/html/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app1.rule=Host(`app1.example.com`)"
      - "traefik.http.routers.app1.tls.certresolver=letsencrypt"
      - "traefik.http.services.app1.loadbalancer.server.port=8080"
    networks:
      - frontend
      - backend

  app1-db:
    image: postgres:16-alpine
    container_name: app1-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app1_db
      POSTGRES_USER: app1_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - app1-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app1_user -d app1_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app1-redis:
    image: redis:7-alpine
    container_name: app1-redis
    restart: unless-stopped
    networks:
      - backend

  # ============================================================
  # App 2 — Secondary Laravel Application (normal priority)
  # ============================================================
  app2-web:
    image: app2-image:latest
    container_name: app2-web
    restart: unless-stopped
    depends_on:
      app2-db:
        condition: service_healthy
      app2-redis:
        condition: service_started
    environment:
      APP_NAME: "App2"
      APP_ENV: production
      APP_KEY: base64:REPLACE_WITH_YOUR_REAL_APP_KEY
      APP_DEBUG: "false"
      APP_URL: https://app2.example.com
      DB_CONNECTION: pgsql
      DB_HOST: app2-db
      DB_PORT: "5432"
      DB_DATABASE: app2_db
      DB_USERNAME: app2_user
      DB_PASSWORD: secret_password
      REDIS_HOST: app2-redis
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app2-storage:/var/www/html/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app2.rule=Host(`app2.example.com`)"
      - "traefik.http.routers.app2.tls.certresolver=letsencrypt"
      - "traefik.http.services.app2.loadbalancer.server.port=8080"
    networks:
      - frontend
      - backend

  app2-db:
    image: postgres:16-alpine
    container_name: app2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app2_db
      POSTGRES_USER: app2_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - app2-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app2_user -d app2_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app2-redis:
    image: redis:7-alpine
    container_name: app2-redis
    restart: unless-stopped
    networks:
      - backend

  # ============================================================
  # App 3 — Lightweight Laravel Application (low priority)
  # ============================================================
  app3-web:
    image: app3-image:latest
    container_name: app3-web
    restart: unless-stopped
    depends_on:
      app3-db:
        condition: service_healthy
      app3-redis:
        condition: service_started
    environment:
      APP_NAME: "App3"
      APP_ENV: production
      APP_KEY: base64:REPLACE_WITH_YOUR_REAL_APP_KEY
      APP_DEBUG: "false"
      APP_URL: https://app3.example.com
      DB_CONNECTION: pgsql
      DB_HOST: app3-db
      DB_PORT: "5432"
      DB_DATABASE: app3_db
      DB_USERNAME: app3_user
      DB_PASSWORD: secret_password
      REDIS_HOST: app3-redis
      REDIS_PORT: "6379"
    volumes:
      - app3-storage:/var/www/html/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app3.rule=Host(`app3.example.com`)"
      - "traefik.http.routers.app3.tls.certresolver=letsencrypt"
      - "traefik.http.services.app3.loadbalancer.server.port=8080"
    networks:
      - frontend
      - backend

  app3-db:
    image: postgres:16-alpine
    container_name: app3-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app3_db
      POSTGRES_USER: app3_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - app3-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app3_user -d app3_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app3-redis:
    image: redis:7-alpine
    container_name: app3-redis
    restart: unless-stopped
    networks:
      - backend

  # ============================================================
  # Edge — Reverse Proxy
  # ============================================================
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - frontend

  # ============================================================
  # Operations
  # ============================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_INCLUDE_STOPPED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ============================================================
  # Observability / Monitoring
  # ============================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.example.com`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - frontend

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.example.com`)"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    networks:
      - frontend

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.example.com`)"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    networks:
      - frontend

  # ============================================================
  # Additional Services
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.example.com
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      DB_TYPE: sqlite
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.example.com`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    networks:
      - frontend
      - backend

  redis-n8n:
    image: redis:7-alpine
    container_name: redis-n8n
    restart: unless-stopped
    networks:
      - backend

# ============================================================
# Volumes
# ============================================================
volumes:
  app1-storage:
  app1-db-data:
  app2-storage:
  app2-db-data:
  app3-storage:
  app3-db-data:
  traefik-certs:
  portainer-data:
  uptime-kuma-data:
  n8n-data:

# ============================================================
# Networks
# ============================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
